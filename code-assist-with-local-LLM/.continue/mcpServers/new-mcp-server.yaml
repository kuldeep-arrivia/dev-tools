name: New MCP server
version: 0.0.1
schema: v1
mcpServers:
  - name: search-the-web
    command: /path_to_project_folder/.venv/bin/python3 #result of command which python3. Do create venv (virtual env and do pip install in this directory first)
    args:
      - /path_to_project_folder/mcp_search_server.py
    env:
      TAVILY_API_KEY: <your_Tavily_api_key>


